apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: mongo:7
        imagePullPolicy: IfNotPresent
        command: ["bash", "-c"]
        args:
        - |
          for h in mongo-0 mongo-1 mongo-2; do
            until mongosh --quiet --host $h.mongo --eval 'db.adminCommand("ping")'; do sleep 3; done
          done
          mongosh --host mongo-0.mongo --eval '
          rs.initiate({_id:"rs0", members:[
            {_id:0, host:"mongo-0.mongo:27017"},
            {_id:1, host:"mongo-1.mongo:27017"},
            {_id:2, host:"mongo-2.mongo:27017"}]})'
